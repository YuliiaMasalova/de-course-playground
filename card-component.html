<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Component — Default / Hover</title>

  <!-- Підключення Tailwind CSS через CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Design tokens (CSS-змінні, згенеровані Style Dictionary з tokens.json) -->
  <link rel="stylesheet" href="src/styles/tokens.css">
</head>
<body class="min-h-screen bg-slate-100 flex flex-col items-center justify-center gap-8 p-6">

  <div class="text-center">
    <h1 class="text-xl font-semibold text-slate-900 mb-1">Card Component</h1>
    <p class="text-sm text-slate-500">Наведи курсор, щоб побачити стан Hover</p>
    <p class="text-xs text-slate-400 mt-1">Кольори — через var(--card-*) з tokens.css</p>
  </div>

  <!-- Картка блогу: зображення замінено на градієнтний плейсхолдер,
       щоб не тримати в репозиторії нестабільне зовнішнє посилання на фото -->
  <a
    href="#"
    class="group bg-[var(--card-bg)] border-2 border-[var(--card-border)] hover:border-[var(--card-border-hover)]
           flex flex-col gap-3 p-8 rounded-[32px] w-[500px] max-w-full
           transition-colors duration-200 active:scale-[0.99]"
  >
    <div class="h-64 rounded-2xl bg-gradient-to-br from-[var(--brand-primary)] to-[var(--color-base-black)] flex items-center justify-center">
      <svg class="size-16 text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
    </div>

    <p class="text-[16px] text-[var(--card-text-secondary)] group-hover:text-[var(--card-text-title)]">December 12, 2024</p>

    <h2 class="text-2xl font-bold text-[var(--card-text-title)]">How I Finally Understood Crypto</h2>

    <p class="text-[16px] text-[var(--card-text-secondary)] group-hover:text-[var(--card-text-title)]">
      The story of Alex, who turned confusing signals into clear decisions thanks to wallet tracking and smart alerts.
    </p>

    <div class="flex gap-5 mt-2">
      <span class="bg-[var(--color-base-black)] text-[var(--button-text)] text-[18px] px-4 py-1 rounded-full">Crypto Signals</span>
      <span class="bg-[var(--color-base-black)] text-[var(--button-text)] text-[18px] px-4 py-1 rounded-full">For Beginners</span>
    </div>
  </a>

</body>
</html>
