<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Component — усі стани</title>

  <!-- Підключення Tailwind CSS через CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

  <div class="bg-white rounded-2xl shadow-lg p-10 max-w-md w-full flex flex-col gap-8">

    <div class="text-center">
      <h1 class="text-xl font-semibold text-slate-900 mb-1">Input Component</h1>
      <p class="text-sm text-slate-500">Default · Focused · Filled · Error · Disabled</p>
      <p class="text-xs text-slate-400 mt-1">Кольори — з Figma variables (input/*)</p>
    </div>

    <!-- Жива інтерактивна версія поля: Default → Focused (клік) → Filled (введення) → Error (валідація) -->
    <div class="flex flex-col gap-2">
      <label for="demo-email" class="text-[16px] text-[#394753]">Email*</label>
      <div class="flex items-center justify-between border border-[#b0bec9] px-4 py-4 w-full transition-colors focus-within:border-[#2563eb]" id="demo-field">
        <div class="flex items-center gap-2 flex-1 min-w-0">
          <svg class="shrink-0 size-5 text-[#b0bec9]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-4 7.5"/>
          </svg>
          <input
            id="demo-email"
            type="email"
            placeholder="ex. email@domain.com"
            class="flex-1 min-w-0 outline-none text-[16px] tracking-[0.16px] text-[#394753] placeholder-[#b0bec9] bg-transparent"
          >
        </div>
        <button type="button" id="demo-clear" aria-label="Очистити поле" class="shrink-0 text-[#b0bec9] hover:text-[#394753]">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <p id="demo-helper" class="text-xs tracking-[0.12px] text-[#425362]">One lowercase character</p>
    </div>

    <!-- Статичні знімки всіх станів для референсу -->
    <div class="flex flex-col gap-5 pt-4 border-t border-slate-200">

      <!-- Default -->
      <div class="flex flex-col gap-2">
        <label class="text-[16px] text-[#394753]">Email*</label>
        <div class="flex items-center justify-between border border-[#b0bec9] px-4 py-4 w-full">
          <div class="flex items-center gap-2">
            <svg class="size-5 text-[#b0bec9]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-4 7.5"/></svg>
            <span class="text-[16px] tracking-[0.16px] text-[#b0bec9]">ex. email@domain.com</span>
          </div>
          <svg class="size-5 text-[#b0bec9]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
        <p class="text-xs tracking-[0.12px] text-[#425362]">One lowercase character</p>
      </div>

      <!-- Filled -->
      <div class="flex flex-col gap-2">
        <label class="text-[16px] text-[#394753]">Email*</label>
        <div class="flex items-center justify-between border border-[#b0bec9] px-4 py-4 w-full">
          <div class="flex items-center gap-2">
            <svg class="size-5 text-[#394753]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-4 7.5"/></svg>
            <span class="text-[16px] tracking-[0.16px] text-[#394753]">yuliia@domain.com</span>
          </div>
          <svg class="size-5 text-[#394753]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
        <p class="text-xs tracking-[0.12px] text-[#425362]">One lowercase character</p>
      </div>

      <!-- Error -->
      <div class="flex flex-col gap-2">
        <label class="text-[16px] text-[#394753]">Email*</label>
        <div class="flex items-center justify-between border border-[#f43f5e] px-4 py-4 w-full">
          <div class="flex items-center gap-2">
            <svg class="size-5 text-[#f43f5e]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-4 7.5"/></svg>
            <span class="text-[16px] tracking-[0.16px] text-[#394753]">yuliia@domain</span>
          </div>
          <svg class="size-5 text-[#394753]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
        <p class="text-xs tracking-[0.12px] text-[#e11d48]">One lowercase character</p>
      </div>

      <!-- Disabled -->
      <div class="flex flex-col gap-2">
        <label class="text-[16px] text-[#d5dce2]">Email*</label>
        <div class="flex items-center justify-between border border-[#d5dce2] px-4 py-4 w-full">
          <div class="flex items-center gap-2">
            <svg class="size-5 text-[#d5dce2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-4 7.5"/></svg>
            <span class="text-[16px] tracking-[0.16px] text-[#d5dce2]">ex. email@domain.com</span>
          </div>
          <svg class="size-5 text-[#d5dce2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
      </div>

    </div>

  </div>

  <script>
    // Мікро-інтеракція: Focused при фокусі, Filled при введенні тексту,
    // Error якщо email не містить "@" після втрати фокусу
    const input = document.getElementById('demo-email');
    const helper = document.getElementById('demo-helper');
    const clearBtn = document.getElementById('demo-clear');

    input.addEventListener('blur', () => {
      const isError = input.value.length > 0 && !input.value.includes('@');
      helper.textContent = isError ? 'Введіть коректний email' : 'One lowercase character';
      helper.classList.toggle('text-[#e11d48]', isError);
      helper.classList.toggle('text-[#425362]', !isError);
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      input.focus();
    });
  </script>

</body>
</html>
