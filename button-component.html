<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Component — усі стани</title>

  <!-- Підключення Tailwind CSS через CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

  <div class="bg-white rounded-2xl shadow-lg p-10 max-w-md w-full text-center flex flex-col gap-8">

    <div>
      <h1 class="text-xl font-semibold text-slate-900 mb-1">Button Component</h1>
      <p class="text-sm text-slate-500">Default · Hover · Active · Disabled</p>
      <p class="text-xs text-slate-400 mt-1">Кольори й розміри — з Figma variables (button/*)</p>
    </div>

    <!-- Інтерактивна кнопка: Default → Hover → Active обробляються Tailwind-варіантами,
         Disabled перемикається чекбоксом нижче через JS -->
    <button
      id="demo-button"
      type="button"
      class="bg-[#2563eb] hover:bg-[#6d96f2] active:bg-[#1d4ed8]
             active:scale-95
             disabled:bg-[#d5dce2] disabled:text-[#b0bec9] disabled:cursor-not-allowed disabled:active:scale-100
             text-white font-medium px-4 py-2 gap-1 rounded-lg
             transition-all duration-200 ease-out
             mx-auto"
    >
      Написати мені
    </button>

    <!-- Перемикач стану Disabled для демонстрації -->
    <label class="flex items-center justify-center gap-2 text-sm text-slate-600 cursor-pointer select-none">
      <input id="disable-toggle" type="checkbox" class="w-4 h-4 accent-[#2563eb]">
      Вимкнути кнопку (Disabled)
    </label>

    <!-- Статичні знімки всіх станів для референсу -->
    <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-200">
      <div class="flex flex-col items-center gap-2">
        <button type="button" class="bg-[#2563eb] text-white font-medium px-4 py-2 rounded-lg text-sm">
          Default
        </button>
        <span class="text-xs text-slate-400">bg #2563eb</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <button type="button" class="bg-[#6d96f2] text-white font-medium px-4 py-2 rounded-lg text-sm">
          Hover
        </button>
        <span class="text-xs text-slate-400">bg #6d96f2</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <button type="button" class="bg-[#1d4ed8] scale-95 text-white font-medium px-4 py-2 rounded-lg text-sm">
          Active
        </button>
        <span class="text-xs text-slate-400">bg #1d4ed8 + scale-95</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <button type="button" disabled class="bg-[#d5dce2] text-[#b0bec9] cursor-not-allowed font-medium px-4 py-2 rounded-lg text-sm">
          Disabled
        </button>
        <span class="text-xs text-slate-400">bg #d5dce2, текст #b0bec9</span>
      </div>
    </div>

  </div>

  <script>
    // Мікро-інтеракція: перемикач вмикає/вимикає стан Disabled на живій кнопці
    const button = document.getElementById('demo-button');
    const toggle = document.getElementById('disable-toggle');

    toggle.addEventListener('change', () => {
      button.disabled = toggle.checked;
    });

    // Легкий "pulse" на клік, якщо кнопка активна
    button.addEventListener('click', () => {
      if (button.disabled) return;
      button.classList.add('scale-105');
      setTimeout(() => button.classList.remove('scale-105'), 150);
    });
  </script>

</body>
</html>
