<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Row Component — усі стани</title>

  <!-- Підключення Tailwind CSS через CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

  <div class="bg-white rounded-2xl shadow-lg p-10 max-w-2xl w-full flex flex-col gap-8">

    <div class="text-center">
      <h1 class="text-xl font-semibold text-slate-900 mb-1">Table Row Component</h1>
      <p class="text-sm text-slate-500">Default · Hover · Selected · Skeleton</p>
      <p class="text-xs text-slate-400 mt-1">Кольори — з Figma variables (table-row/*, cell/*)</p>
    </div>

    <!-- Жива інтерактивна версія: Hover — курсор, Selected — клік перемикає стан -->
    <button
      type="button"
      id="demo-row"
      class="border border-[#b0bec9] hover:border-[#2563eb] data-[selected=true]:bg-[#eceff2] data-[selected=true]:border-[#2563eb]
             flex items-center gap-4 px-0 py-1 rounded-lg w-full transition-colors text-left"
    >
      <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218]">Jordi in Cryptoland</span>
      <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218] text-center">293,190,860.970</span>
      <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218] text-center">$0.9992</span>
    </button>
    <p class="text-xs text-slate-400 -mt-4">Клікни на рядок, щоб перемкнути Selected</p>

    <!-- Статичні знімки всіх станів для референсу -->
    <div class="flex flex-col gap-3 pt-4 border-t border-slate-200">

      <!-- Default -->
      <div class="border border-[#b0bec9] bg-white flex items-center gap-4 px-0 py-1 rounded-lg w-full">
        <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218]">Jordi in Cryptoland</span>
        <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218] text-center">293,190,860.970</span>
        <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218] text-center">$0.9992</span>
      </div>

      <!-- Hover -->
      <div class="border border-[#2563eb] bg-white flex items-center gap-4 px-0 py-1 rounded-lg w-full">
        <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218]">Jordi in Cryptoland</span>
        <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218] text-center">293,190,860.970</span>
        <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218] text-center">$0.9992</span>
      </div>

      <!-- Selected -->
      <div class="border border-[#2563eb] bg-[#eceff2] flex items-center gap-4 px-0 py-1 rounded-lg w-full">
        <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218]">Jordi in Cryptoland</span>
        <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218] text-center">293,190,860.970</span>
        <span class="flex-1 px-6 py-4 text-[16px] font-medium text-[#0f1218] text-center">$0.9992</span>
      </div>

      <!-- Skeleton -->
      <div class="border border-[#b0bec9] bg-white flex items-center gap-4 px-0 py-1 rounded-lg w-full" aria-hidden="true">
        <span class="flex-1 px-6 py-4">
          <span class="block h-4 w-24 rounded bg-[#eceff2] animate-pulse"></span>
        </span>
        <span class="flex-1 px-6 py-4 flex justify-center">
          <span class="block h-4 w-28 rounded bg-[#eceff2] animate-pulse"></span>
        </span>
        <span class="flex-1 px-6 py-4 flex justify-center">
          <span class="block h-4 w-16 rounded bg-[#eceff2] animate-pulse"></span>
        </span>
      </div>

    </div>

  </div>

  <script>
    // Мікро-інтеракція: клік перемикає стан Selected на живому рядку
    const row = document.getElementById('demo-row');
    row.addEventListener('click', () => {
      const isSelected = row.dataset.selected === 'true';
      row.dataset.selected = String(!isSelected);
    });
  </script>

</body>
</html>
