<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Obsidian Card</title>
  <!-- Этот скрипт загружает и активирует все классы Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- Темный фон для красивого отображения по центру -->
<body class="min-h-screen bg-[#0D0D0D] flex items-center justify-center p-10">

  <!-- Твоя карточка -->
  <div class="w-[380px] bg-[#1A1A1A] p-[20px] rounded-[20px] border border-white/20 text-white font-['Urbanist']">
    
    <!-- Картинка кристалла (на всю ширину с учетом отступов карточки) -->
    <div class="w-[340px] h-[347px] overflow-hidden rounded-[12px]">
      <img src="https://img.magnific.com/premium-photo/black-diamond-is-black-background_651890-720.jpg?w=2000" alt="Black Obsidian Stone" class="w-full h-full object-cover transition-transform duration-300 hover:scale-105" />
    </div>

    <!-- Заголовок и описание -->
    <div class="mt-[25px] flex flex-col gap-[10px]">
      <h2 class="text-[26px] font-[600]">Black Obsidian Stone</h2>
      <p class="text-[16px] font-medium text-white/50">A powerful protective stone that grounds your energy and shields from negativity and emotional stress.</p>
    </div>

    <!-- Кнопки-теги -->
    <div class="flex flex-wrap gap-x-[10px] gap-y-[8px] mt-[25px]">
      <span class="inline-flex items-center justify-center gap-[6px] px-[16px] py-[8px] rounded-full border border-white/20 text-[14px] font-medium text-white">
        Medium Size
      </span>
      <span class="inline-flex items-center justify-center gap-[6px] px-[16px] py-[8px] rounded-full border border-white/20 text-[14px] font-medium text-white">
        1–2x Week
      </span>
      <span class="inline-flex items-center justify-center gap-[6px] px-[16px] py-[8px] rounded-full border border-white/20 text-[14px] font-medium text-white">
        Use: Grounding, Boundaries
      </span>
    </div>

    <!-- Нижняя строка: цена и кнопка -->
    <div class="mt-[25px] flex items-center gap-[20px]">
      <span class="text-[26px] font-semibold text-white">32$</span>
      <button class="bg-[#833A8F] text-white px-6 py-3 rounded-full text-[16px] font-medium transition-all duration-300 hover:brightness-110 hover:scale-105 hover:shadow-[0_0_15px_rgba(131,58,143,0.5)]">
        Browse Crystals
      </button>
    </div>

  </div>

</body>
</html>
